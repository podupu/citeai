# Local self-hosted stack built from this checkout.
#
#   cp .env.example .env   # then fill in the secrets
#   docker compose up -d --build
#
# The web app is served on http://localhost:${WEB_PORT:-1515}.
# For pinned release images, use the `elmo` CLI instead (`elmo init`).

name: elmo

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: elmo
    volumes:
      # PostgreSQL 18 puts PGDATA in a version-specific child directory and
      # declares its volume at this parent; mounting the child path can land
      # the cluster in an anonymous volume that disappears on recreation.
      - postgres_data:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  db-migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: migrate
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/elmo
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
      args:
        DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-local}
    env_file:
      - path: .env
        required: true
    ports:
      - "${WEB_PORT:-1515}:3000"
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
      args:
        DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-local}
    env_file:
      - path: .env
        required: true
    # On SIGTERM the worker gives pg-boss 30s to finish in-flight jobs, then
    # flushes telemetry; Compose's 10s default would SIGKILL it mid-evaluation.
    stop_grace_period: 35s
    depends_on:
      db-migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
